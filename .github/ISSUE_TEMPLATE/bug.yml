name: Bug · 버그
description: Something looks wrong or does not work. · 화면이 이상하거나 기능이 동작하지 않습니다.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach raw mission logs: they contain other players' names. Save the replay in the viewer and paste its share link.
        임무 로그 원본은 올리지 마세요. 다른 플레이어 이름이 들어 있습니다. 뷰어에서 저장한 뒤 공유 링크를 붙여 주세요.
  - type: textarea
    id: what
    attributes:
      label: What happened · 무슨 일이 있었나요
      description: What you did, what you expected and what you saw. · 무엇을 했고, 무엇을 기대했고, 실제로 무엇이 보였는지
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Share link · 공유 링크
      description: A share link to the replay, if it helps (https://hd2-replay.code0987.me/s/…). · 도움이 된다면 리플레이 공유 링크
      placeholder: https://hd2-replay.code0987.me/s/
  - type: input
    id: moment
    attributes:
      label: Time in the replay · 리플레이 시각
      description: Where in the replay it shows up, e.g. 12:34. · 문제가 보이는 시각
  - type: input
    id: browser
    attributes:
      label: Browser and device · 브라우저와 기기
      placeholder: Chrome 130 / Windows 11
  - type: input
    id: mod
    attributes:
      label: HD2 History version · HD2 History 버전
      placeholder: 1.2.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else · 스크린샷이나 기타
